<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="תמיר שורץ, צלם. עבודות, סדרות וטקסטים. Tamir Schwarts, photographer.">
<meta property="og:title" content="תמיר שורץ · צילום | Tamir Schwarts · Photography">
<meta property="og:description" content="תמיר שורץ, צלם. עבודות, סדרות וטקסטים. Tamir Schwarts, photographer.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://wtfamidoing.art/">
<meta property="og:image" content="https://wtfamidoing.art/photos/beyond-the-fence-s.jpg">
<meta property="og:image:width" content="1000">
<meta property="og:image:height" content="750">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=Frank+Ruhl+Libre:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/style.css?v=20261114192019">
</head>
<body>
<a class="skip" href="#works" data-ui="skip">דלג לעבודות</a>

<nav class="nav at-top">
  <a class="nav-name" href="#top" data-bind="navname"></a>
  <div class="nav-links">
    <a href="#works" data-ui="works">עבודות</a>
    <span class="nav-proj" id="nav-proj" hidden><button type="button" class="nav-btn" id="nav-proj-btn" aria-expanded="false" aria-controls="nav-sub" data-ui="projects">פרויקטים</button><div class="nav-sub" id="nav-sub" hidden></div></span>
    <a href="#writing" id="nav-writing" data-ui="writing">טקסטים</a>
    <a href="#about" data-ui="about">אודות</a>
    <a href="#contact" data-ui="contact">קשר</a>
  </div>
  <span class="nav-ext" id="nav-ext"></span>
  <button type="button" class="lang" id="lang" aria-label="Switch to English">EN</button>
</nav>

<header class="hero" id="top">
  <h1 class="hero-name" id="hero-name"></h1>
  <div class="strips" id="strips"></div>
  <div class="hero-foot">
    <p class="tagline" data-bind="tagline"></p>
    <p class="motto" data-ui="motto">צילום · קריעה · הרכבה מחדש</p>
  </div>
</header>

<main>
  <section class="works" id="works">
    <div class="rule">
      <h2 data-ui="works">עבודות</h2>
      <span class="count" id="count"></span>
    </div>
    <p class="shop-note" id="shop-note"></p>
    <h3 class="proj-title" id="proj-title"></h3>
    <p class="proj-desc" id="proj-desc"></p>
    <div id="plates"></div>
  </section>

  <section class="writing" id="writing">
    <div class="slip">
      <p class="eyebrow" id="writing-label" data-ui="writing">טקסטים</p>
      <blockquote data-bind="quote"></blockquote>
      <ul class="text-list" id="text-list"></ul>
    </div>
  </section>

  <section class="about" id="about">
    <div class="rule"><h2 data-ui="about">אודות</h2></div>
    <div class="about-grid">
      <img id="portrait" alt="" loading="lazy">
      <div class="about-body" id="about-body"></div>
    </div>
  </section>
</main>

<footer class="foot" id="contact">
  <div class="foot-links" id="foot-links"></div>
</footer>

<dialog class="viewer" id="viewer" aria-label="work">
  <button type="button" class="v-close" id="v-close" aria-label="Close">×</button>
  <button type="button" class="v-nav v-prev" id="v-prev" aria-label="Previous">→</button>
  <img id="v-img" alt="">
  <button type="button" class="v-nav v-next" id="v-next" aria-label="Next">←</button>
  <div class="v-cap">
    <span class="v-num" id="v-num"></span>
    <span class="v-title" id="v-title"></span>
    <span class="v-meta" id="v-meta"></span>
  </div>
</dialog>

<dialog class="reader" id="reader">
  <button type="button" class="v-close" id="r-close" aria-label="Close">×</button>
  <article id="r-body"></article>
</dialog>

<script src="assets/app.js?v=20261114192019"></script>
</body>
</html>
